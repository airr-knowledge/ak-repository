# AK Docker Orchestration

# AIRR Knowledge database services

services:
    ak-db:
        image: postgres:16
        container_name: ak-db
        restart: always
        env_file: ./../../.env
        shm_size: 64gb
        command: >
            -c max_wal_size=16GB
            -c min_wal_size=2GB
            -c max_worker_processes=32
            -c max_parallel_workers=32
            -c max_parallel_workers_per_gather=12
            -c parallel_tuple_cost=0.01
            -c parallel_setup_cost=10
            -c min_parallel_table_scan_size=8MB
            -c shared_buffers=512GB
            -c effective_cache_size=750GB
        volumes:
            - ${DATA_ROOT}/pgdata:/var/lib/postgresql/data
#            - ${IMPORT_DATA}/ak-data-import:/iedb_data
#            - ${IMPORT_DATA}/vdjserver-adc-cache:/adc_data
        networks:
            - ak-db-network
        healthcheck:
            test: pg_isready -h ak-db -d postgres -U postgres
            interval: 10s
            timeout: 3s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 900gb

    adminer:
        image: adminer
        restart: always
        ports:
            - 127.0.0.1:8080:8080
        networks:
            - ak-db-network
        depends_on:
            ak-db:
                condition: service_healthy

    ak-redis:
        container_name: ak-redis
        image: redis:7.2.0-alpine
        restart: always
        networks:
            - ak-db-network
        command: redis-server --save 60 1 --loglevel warning --appendonly yes
        volumes:
            - ./../../redis:/data

networks:
    ak-db-network:
        name: ak-db-network
        driver: bridge
